<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista Android - Portal del Paciente</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: start center;
      min-height: 100vh;
      padding: 16px;
      overflow: auto;
      background: #e8eeee;
    }

    .phone-preview {
      position: relative;
      width: 386px;
      height: 686px;
      padding: 20px 12px 24px;
      overflow: hidden;
      border: 1px solid #26364a;
      border-radius: 34px;
      background: #132136;
      box-shadow: 0 18px 45px rgb(15 36 54 / 22%);
    }

    .phone-preview::before {
      position: absolute;
      z-index: 2;
      top: 6px;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #415065;
      content: "";
      transform: translateX(-50%);
      pointer-events: none;
    }

    .phone-preview iframe {
      display: block;
      width: 360px;
      height: 640px;
      border: 0;
      border-radius: 23px;
      background: #ffffff;
    }

    .phone-preview::after {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 72px;
      height: 3px;
      border-radius: 3px;
      background: #c6d2dd;
      content: "";
      transform: translateX(-50%);
      pointer-events: none;
    }

    @media (max-width: 440px) {
      body {
        display: block;
        padding: 0;
        background: #ffffff;
      }

      .phone-preview {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .phone-preview::before,
      .phone-preview::after {
        display: none;
      }

      .phone-preview iframe {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main class="phone-preview" aria-label="Vista Android del portal del paciente, 360 por 640 píxeles">
    <iframe src="/patient" title="Portal del Paciente"></iframe>
  </main>
</body>
</html>
