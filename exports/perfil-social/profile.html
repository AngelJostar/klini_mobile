<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil</title><link rel="stylesheet" href="activity.css"><link rel="stylesheet" href="profile.css"></head><body class="native-shell">
<button type="button" data-profile-panel-open>Abrir perfil</button>
<dialog id="social-profile" aria-labelledby="profile-heading" data-patient-profile-panel data-profile-id="preview"><header><h1 id="profile-heading">Tu cuenta</h1><button type="button" data-profile-close aria-label="Cerrar perfil">×</button></header>
<section id="profile-home"><button class="profile-account" type="button" data-profile-edit><span class="profile-avatar" data-profile-initials>U</span><span><strong data-profile-name>Usuario</strong><small>Cambiar perfil</small></span><span aria-hidden="true">›</span></button><div class="patient-social" data-patient-social data-storage-key="social-profile-activity" data-demo="true"></div><footer><button type="button" data-profile-logout>Cerrar sesión</button></footer></section>
<section id="profile-edit" hidden><button type="button" data-profile-back>‹ Volver a tu cuenta</button><h2>Cambiar perfil</h2><form id="profile-form"><label>Nombre<input name="name" maxlength="255" required autocomplete="name"></label><p>Actualiza el nombre visible de tu propia cuenta.</p><button type="button" data-profile-back>Cancelar</button><button type="submit">Guardar cambios</button><p role="status" data-profile-save-status></p></form></section>
<section id="profile-logout" hidden><h2>¿Quieres cerrar tu sesión?</h2><p>La actividad de demostración guardada en este dispositivo permanecerá almacenada.</p><button type="button" data-profile-back>Cancelar</button><button type="button" id="profile-confirm-logout">Cerrar sesión</button><p role="alert" data-profile-logout-error></p></section>
</dialog>
<!-- En Laravel configura profile.js con las rutas del README y agrega csrf-token. -->
<script src="profile.js"></script><script src="activity.js"></script></body></html>
